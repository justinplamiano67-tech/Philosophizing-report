<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Methods of Philosophizing Quiz</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f3f5;
    color: #222;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 12px;
}

.card {
    width: 100%;
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

/* HEADER */

.title {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
}

/* INFO */

.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* TIMER */

.timer-box {
    width: 100%;
    text-align: center;
    margin-bottom: 15px;
}

.timer {
    display: inline-block;
    min-width: 90px;
    padding: 10px 18px;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.timer.warning {
    background: #dc2626;
}

/* PROGRESS */

.progress-background {
    width: 100%;
    height: 9px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #222;
    transition: width 0.3s ease;
}

/* QUESTION */

.question {
    font-size: 20px;
    font-weight: bold;
    line-height: 1.45;
    margin-bottom: 18px;
}

/* OPTIONS */

.option {
    width: 100%;
    min-height: 58px;
    padding: 14px 15px;
    margin-bottom: 11px;
    background: white;
    border: 2px solid #d5d5d5;
    border-radius: 13px;
    font-size: 16px;
    text-align: left;
    color: #222;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.2s;
}

.option:active {
    transform: scale(0.98);
}

.option.selected {
    background: #eeeeee;
    border-color: #222;
}

/* RESULT */

.result {
    display: none;
    text-align: center;
}

.result-title {
    font-size: 26px;
    font-weight: bold;
}

.final-score {
    font-size: 48px;
    font-weight: bold;
    margin: 20px 0;
}

.message {
    font-size: 16px;
    line-height: 1.5;
}

/* REVIEW */

.review {
    text-align: left;
    margin-top: 25px;
}

.review-title {
    text-align: center;
    font-size: 20px;
    margin-bottom: 15px;
}

.review-item {
    padding: 14px 5px;
    border-bottom: 1px solid #ddd;
    font-size: 15px;
    line-height: 1.5;
}

/* RESTART */

.restart-button {
    width: 100%;
    min-height: 55px;
    margin-top: 20px;
    border: none;
    border-radius: 13px;
    background: #222;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

/* SMALL PHONES */

@media screen and (max-width: 360px) {

    .container {
        padding: 8px;
    }

    .card {
        padding: 14px;
    }

    .title {
        font-size: 22px;
    }

    .question {
        font-size: 18px;
    }

    .option {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<!-- ================================
     QUIZ
================================ -->

<div id="quizPage">

<div class="title">
    Methods of Philosophizing
</div>

<div class="subtitle">
    15 Multiple Choice + 5 True or False
</div>

<div class="info">

<span id="questionNumber">
Question 1 of 20
</span>

</div>


<!-- TIMER -->

<div class="timer-box">

<div class="timer" id="timer">
30
</div>

</div>


<!-- PROGRESS -->

<div class="progress-background">

<div class="progress" id="progress">
</div>

</div>


<!-- QUESTION -->

<div class="question" id="question">
</div>


<!-- OPTIONS -->

<div id="options"></div>

</div>


<!-- ================================
     RESULT
================================ -->

<div class="result" id="resultPage">

<div class="result-title">
    Quiz Complete!
</div>

<div class="final-score" id="finalScore">
    0 / 20
</div>

<div class="message" id="resultMessage">
</div>

<div class="review">

<div class="review-title">
    Answer Review
</div>

<div id="reviewList"></div>

</div>

<button
    class="restart-button"
    id="restartButton">

    Take Quiz Again

</button>

</div>

</div>

</div>


<script>

/* ==========================================
   QUESTIONS
========================================== */

const questions = [

{
    question: "What is philosophizing?",
    options: [
        "Thinking deeply about important questions",
        "Memorizing many facts",
        "Following what most people say",
        "Avoiding difficult questions"
    ],
    answer: 0
},

{
    question: "Which is an important part of philosophizing?",
    options: [
        "Asking meaningful questions",
        "Accepting every claim immediately",
        "Ignoring evidence",
        "Avoiding different ideas"
    ],
    answer: 0
},

{
    question: "Which statement is an opinion?",
    options: [
        "Watching movies is more enjoyable than reading books.",
        "Water freezes at 0°C under standard conditions.",
        "There are 24 hours in a day.",
        "The Earth orbits the Sun."
    ],
    answer: 0
},

{
    question: "What is truth?",
    options: [
        "Something that agrees with reality or actual facts",
        "Anything a person strongly believes",
        "A personal preference",
        "A statement everyone likes"
    ],
    answer: 0
},

{
    question: "Why should we know the difference between opinion and truth?",
    options: [
        "To think carefully and make better decisions",
        "To make everyone agree with us",
        "To avoid asking questions",
        "To prove that every opinion is wrong"
    ],
    answer: 0
},

{
    question: "What is analysis?",
    options: [
        "Carefully examining an idea or situation by looking at its parts",
        "Choosing an answer without checking",
        "Agreeing with the first person who speaks",
        "Ignoring important details"
    ],
    answer: 0
},

{
    question: "Why should we ask who gave the information?",
    options: [
        "To know where the information came from",
        "To make the information automatically true",
        "To avoid checking the source",
        "To make the rumor more interesting"
    ],
    answer: 0
},

{
    question: "What does reasoning involve?",
    options: [
        "Using logic and clear reasons",
        "Using only emotions",
        "Following popularity",
        "Guessing quickly"
    ],
    answer: 0
},

{
    question: "How does questioning help us?",
    options: [
        "It helps us discover what we do not understand.",
        "It prevents us from learning new ideas.",
        "It makes every opinion true.",
        "It removes the need for evidence."
    ],
    answer: 0
},

{
    question: "Why is asking “Why is this true?” useful?",
    options: [
        "It asks for reasons or evidence.",
        "It makes a claim automatically true.",
        "It avoids examining the claim.",
        "It changes an opinion into a fact."
    ],
    answer: 0
},

{
    question: "What is reflecting?",
    options: [
        "Thinking deeply about experiences, actions, choices, and beliefs",
        "Ignoring past experiences",
        "Repeating someone else's opinion",
        "Making a decision without thinking"
    ],
    answer: 0
},

{
    question: "How can philosophy lead to wisdom?",
    options: [
        "By encouraging careful thinking and deeper understanding",
        "By teaching people to accept every claim",
        "By avoiding questions",
        "By depending only on popularity"
    ],
    answer: 0
},

{
    question: "What does it mean to evaluate an opinion?",
    options: [
        "Examine its reasons and evidence",
        "Accept it immediately",
        "Reject it without checking",
        "Believe it because someone said it"
    ],
    answer: 0
},

{
    question: "Which question helps evaluate whether a source can be trusted?",
    options: [
        "Is the information reliable?",
        "Is the information popular?",
        "Do many people like the speaker?",
        "Is the claim exciting?"
    ],
    answer: 0
},

{
    question: "Which shows careful evaluation of an opinion?",
    options: [
        "Checking its reasons, evidence, and missing facts before accepting it",
        "Accepting it because a friend said it",
        "Believing it because many people shared it",
        "Rejecting it without looking at evidence"
    ],
    answer: 0
},

{
    question: "Questioning can help us discover what we do not understand.",
    options: [
        "True",
        "False"
    ],
    answer: 0
},

{
    question: "An opinion is always proven true because a person strongly believes it.",
    options: [
        "True",
        "False"
    ],
    answer: 1
},

{
    question: "Reasoning uses logic and clear reasons to reach a conclusion.",
    options: [
        "True",
        "False"
    ],
    answer: 0
},

{
    question: "We should accept an idea immediately without checking evidence.",
    options: [
        "True",
        "False"
    ],
    answer: 1
},

{
    question: "Reflecting on experiences can help us learn from mistakes and make better choices.",
    options: [
        "True",
        "False"
    ],
    answer: 0
}

];


/* ==========================================
   VARIABLES
========================================== */

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

let timerInterval;
let timeLeft = 30;
let questionLocked = false;


/* ==========================================
   ELEMENTS
========================================== */

const questionNumber =
    document.getElementById("questionNumber");

const timer =
    document.getElementById("timer");

const progress =
    document.getElementById("progress");

const question =
    document.getElementById("question");

const options =
    document.getElementById("options");

const quizPage =
    document.getElementById("quizPage");

const resultPage =
    document.getElementById("resultPage");

const finalScore =
    document.getElementById("finalScore");

const resultMessage =
    document.getElementById("resultMessage");

const reviewList =
    document.getElementById("reviewList");

const restartButton =
    document.getElementById("restartButton");


/* ==========================================
   LOAD QUESTION
========================================== */

function loadQuestion() {

    clearInterval(timerInterval);

    questionLocked = false;

    timeLeft = 30;

    timer.textContent = "30";

    timer.classList.remove("warning");

    const current =
        questions[currentQuestion];


    questionNumber.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    progress.style.width =
        (currentQuestion /
        questions.length * 100) + "%";


    question.textContent =
        current.question;


    options.innerHTML = "";


    current.options.forEach(
        function(optionText, index) {

            const button =
                document.createElement("button");

            button.className = "option";

            button.textContent =
                optionText;


            button.addEventListener(
                "click",
                function() {

                    chooseAnswer(index);

                }
            );


            options.appendChild(button);

        }
    );


    startTimer();

}


/* ==========================================
   30 SECOND TIMER
========================================== */

function startTimer() {

    timerInterval =
        setInterval(
            function() {

                timeLeft--;

                timer.textContent =
                    timeLeft;


                if (timeLeft <= 10) {

                    timer.classList.add(
                        "warning"
                    );

                }


                if (timeLeft <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    timeExpired();

                }

            },
            1000
        );

}


/* ==========================================
   TIME EXPIRED
========================================== */

function timeExpired() {

    if (questionLocked) {
        return;
    }

    questionLocked = true;


    /* No answer = -1 */

    userAnswers[currentQuestion] = -1;


    nextQuestion();

}


/* ==========================================
   CHOOSE ANSWER
========================================== */

function chooseAnswer(selectedAnswer) {

    if (questionLocked) {
        return;
    }


    questionLocked = true;


    clearInterval(
        timerInterval
    );


    userAnswers[currentQuestion] =
        selectedAnswer;


    const current =
        questions[currentQuestion];


    if (
        selectedAnswer ===
        current.answer
    ) {

        score++;

    }


    /*
       Do NOT show:
       - correct answer
       - wrong answer
       - explanation
       - score
    */


    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(button) {

            button.disabled = true;

        }
    );


    /*
       Automatically move to
       next question after 500ms
    */

    setTimeout(
        function() {

            nextQuestion();

        },
        500
    );

}


/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion() {

    clearInterval(
        timerInterval
    );


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showResult();

    }

}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult() {

    clearInterval(
        timerInterval
    );


    quizPage.style.display =
        "none";

    resultPage.style.display =
        "block";


    finalScore.textContent =
        score +
        " / " +
        questions.length;


    if (score >= 18) {

        resultMessage.textContent =
            "Excellent! You understood the main ideas very well.";

    }

    else if (score >= 15) {

        resultMessage.textContent =
            "Great job! You have a good understanding of the topic.";

    }

    else if (score >= 10) {

        resultMessage.textContent =
            "Good effort! Review the lessons to strengthen your understanding.";

    }

    else {

        resultMessage.textContent =
            "Keep practicing! Review the lessons and try the quiz again.";

    }


    /* ======================================
       ANSWER REVIEW
    ====================================== */

    reviewList.innerHTML = "";


    questions.forEach(
        function(item, index) {

            const reviewItem =
                document.createElement("div");

            reviewItem.className =
                "review-item";


            const userAnswer =
                userAnswers[index];


            if (userAnswer === -1) {

                reviewItem.innerHTML =
                    "<strong>Question " +
                    (index + 1) +
                    ":</strong> Time expired<br>" +
                    "Correct answer: " +
                    item.options[item.answer];

            }

            else if (
                userAnswer === item.answer
            ) {

                reviewItem.innerHTML =
                    "<strong>Question " +
                    (index + 1) +
                    ":</strong> ✓ Correct<br>" +
                    "Your answer: " +
                    item.options[userAnswer];

            }

            else {

                reviewItem.innerHTML =
                    "<strong>Question " +
                    (index + 1) +
                    ":</strong> ✗ Wrong<br>" +
                    "Your answer: " +
                    item.options[userAnswer] +
                    "<br>Correct answer: " +
                    item.options[item.answer];

            }


            reviewList.appendChild(
                reviewItem
            );

        }
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   RESTART
========================================== */

restartButton.addEventListener(
    "click",
    function() {

        clearInterval(
            timerInterval
        );


        currentQuestion = 0;

        score = 0;

        userAnswers = [];

        questionLocked = false;


        resultPage.style.display =
            "none";

        quizPage.style.display =
            "block";


        loadQuestion();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);


/* ==========================================
   START
========================================== */

loadQuestion();

</script>

</body>
</html>

<script>
/* ==========================================
   QUIZ ANIMATION + COUNTDOWN SOUND SYSTEM
========================================== */

let audioContext = null;


/* ==========================================
   SOUND SYSTEM
========================================== */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* Normal countdown beep */
function beepSound() {

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 800;

    gainNode.gain.setValueAtTime(
        0.12,
        audioContext.currentTime
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.12
    );
}


/* Time-up beep */
function timeUpSound() {

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gainNode =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 500;

    gainNode.gain.setValueAtTime(
        0.18,
        audioContext.currentTime
    );

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.35
    );
}


/* ==========================================
   QUESTION ANIMATION
========================================== */

function animateQuestion() {

    question.style.opacity = "0";
    question.style.transform =
        "translateX(30px)";

    setTimeout(function() {

        question.style.transition =
            "all 0.35s ease";

        question.style.opacity = "1";
        question.style.transform =
            "translateX(0)";

    }, 50);
}


/* ==========================================
   ANSWER ANIMATION
========================================== */

function animateOptions() {

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(function(button, index) {

        button.style.opacity = "0";

        button.style.transform =
            "translateY(20px)";

        setTimeout(function() {

            button.style.transition =
                "all 0.3s ease";

            button.style.opacity = "1";

            button.style.transform =
                "translateY(0)";

        }, 80 + (index * 70));

    });
}


/* ==========================================
   SELECTED ANSWER ANIMATION
========================================== */

function animateSelectedAnswer(button) {

    button.style.transform =
        "scale(0.95)";

    setTimeout(function() {

        button.style.transform =
            "scale(1)";

    }, 150);
}


/* ==========================================
   TIMER ANIMATION
========================================== */

function animateTimerWarning() {

    timer.style.transform =
        "scale(1.12)";

    setTimeout(function() {

        timer.style.transform =
            "scale(1)";

    }, 200);
}


/* ==========================================
   NEXT QUESTION ANIMATION
========================================== */

function animateNextQuestion() {

    question.style.opacity = "0";

    question.style.transform =
        "translateX(-25px)";

    options.style.opacity = "0";

    setTimeout(function() {

        question.style.transition =
            "all 0.35s ease";

        options.style.transition =
            "all 0.35s ease";

        question.style.opacity = "1";

        question.style.transform =
            "translateX(0)";

        options.style.opacity = "1";

    }, 100);
}


/* ==========================================
   RESULT ANIMATION
========================================== */

function animateResult() {

    resultPage.style.opacity = "0";

    resultPage.style.transform =
        "translateY(30px)";

    setTimeout(function() {

        resultPage.style.transition =
            "all 0.5s ease";

        resultPage.style.opacity = "1";

        resultPage.style.transform =
            "translateY(0)";

    }, 100);


    /* Score animation */

    finalScore.style.opacity = "0";

    finalScore.style.transform =
        "scale(0.5)";

    setTimeout(function() {

        finalScore.style.transition =
            "all 0.5s ease";

        finalScore.style.opacity = "1";

        finalScore.style.transform =
            "scale(1)";

    }, 300);


    /* Review animation */

    const reviewItems =
        document.querySelectorAll(".review-item");

    reviewItems.forEach(function(item, index) {

        item.style.opacity = "0";

        item.style.transform =
            "translateY(20px)";

        setTimeout(function() {

            item.style.transition =
                "all 0.3s ease";

            item.style.opacity = "1";

            item.style.transform =
                "translateY(0)";

        }, 500 + (index * 50));

    });
}


/* ==========================================
   LOAD QUESTION
========================================== */

function loadQuestion() {

    clearInterval(timerInterval);

    questionLocked = false;

    timeLeft = 30;

    timer.textContent = "30";

    timer.classList.remove("warning");

    timer.style.transform = "scale(1)";


    const current =
        questions[currentQuestion];


    questionNumber.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    progress.style.width =
        (currentQuestion /
        questions.length * 100) +
        "%";


    question.textContent =
        current.question;


    options.innerHTML = "";


    current.options.forEach(
        function(optionText, index) {

            const button =
                document.createElement("button");

            button.className = "option";

            button.textContent =
                optionText;


            button.addEventListener(
                "click",
                function() {

                    chooseAnswer(index);

                }
            );


            options.appendChild(button);

        }
    );


    /* Animations */

    animateQuestion();

    animateOptions();


    /* Start timer */

    startTimer();
}


/* ==========================================
   30 SECOND TIMER
========================================== */

function startTimer() {

    timerInterval =
        setInterval(function() {

            timeLeft--;

            timer.textContent =
                timeLeft;


            /* ==========================
               LAST 10 SECONDS
            ========================== */

            if (
                timeLeft <= 10 &&
                timeLeft > 0
            ) {

                timer.classList.add(
                    "warning"
                );


                /* Beep */

                beepSound();


                /* Timer animation */

                animateTimerWarning();

            }


            /* ==========================
               TIME EXPIRED
            ========================== */

            if (timeLeft <= 0) {

                clearInterval(
                    timerInterval
                );


                timeUpSound();


                timeExpired();

            }

        }, 1000);
}


/* ==========================================
   TIME EXPIRED
========================================== */

function timeExpired() {

    if (questionLocked) {
        return;
    }

    questionLocked = true;


    userAnswers[currentQuestion] =
        -1;


    nextQuestion();
}


/* ==========================================
   CHOOSE ANSWER
========================================== */

function chooseAnswer(selectedAnswer) {

    if (questionLocked) {
        return;
    }


    questionLocked = true;


    clearInterval(
        timerInterval
    );


    userAnswers[currentQuestion] =
        selectedAnswer;


    const current =
        questions[currentQuestion];


    if (
        selectedAnswer ===
        current.answer
    ) {

        score++;

    }


    /* Selected button */

    const buttons =
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        function(button, index) {

            if (
                index ===
                selectedAnswer
            ) {

                button.classList.add(
                    "selected"
                );

                animateSelectedAnswer(
                    button
                );

            }


            button.disabled = true;

        }
    );


    /* Automatically next */

    setTimeout(
        function() {

            nextQuestion();

        },
        500
    );
}


/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion() {

    clearInterval(
        timerInterval
    );


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;


        animateNextQuestion();


        setTimeout(
            function() {

                loadQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            },
            150
        );


    } else {

        showResult();

    }
}
</script>
